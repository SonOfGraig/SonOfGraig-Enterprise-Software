{{ define "header" }}
<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="color-scheme" content="light only" />
  <base target="_blank">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <!-- listmonk system emails (opt-in confirmation etc.) in the same frame as the
       site's form emails: lib/email/kit.ts. -->
  <style>
    .button { display:inline-block; background:#0B9EDE; background-image:linear-gradient(135deg,#0EA5E9,#0B78DE); color:#ffffff !important; border-radius:999px; padding:13px 26px; text-decoration:none; font-weight:600; font-size:15px; }
    a { color:#0B9EDE; }
    img { max-width:100%; }
    @media (max-width:620px){ .sg-pad{padding:28px 22px !important} .sg-outer{padding:20px 10px !important} }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#EDF4FB;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1F2937;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#EDF4FB" style="background-color:#EDF4FB;background-image:radial-gradient(120% 70% at 0% 0%,#D6ECFB 0%,rgba(214,236,251,0) 60%),radial-gradient(90% 60% at 100% 10%,#E4E6FF 0%,rgba(228,230,255,0) 55%),linear-gradient(180deg,#EEF5FC 0%,#F6F8FB 100%);"><tr><td align="center" class="sg-outer" style="padding:36px 16px 40px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">

      <td style="vertical-align:middle;font-family:Manrope,Inter,-apple-system,sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.02em;color:#0D1117;">sonofgraig <span style="color:#0B9EDE;font-weight:700;">Insights</span></td>
    </tr></table>
  </td></tr>
</table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;border-collapse:separate;">
  <tr><td class="sg-pad" bgcolor="#FFFFFF" style="background-color:#FFFFFF;background-color:rgba(255,255,255,0.86);border:1px solid #FFFFFF;border-radius:24px;box-shadow:0 1px 2px rgba(13,17,23,0.04),0 18px 40px -16px rgba(6,90,130,0.22),0 40px 80px -40px rgba(13,17,23,0.18);padding:38px 40px;">
{{ end }}

</table>
